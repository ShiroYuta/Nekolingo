<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3D5AFE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>html{color-scheme:light}body{margin:0;font-size:14px}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Nekolingo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow app column (max 560px). Sticky stat header, winding lesson path, bottom tab bar. Practice mode is a full-screen overlay with a feedback band at the bottom. */
:root {
  --bg: #EEF1F8;
  --surface: #FFFFFF;
  --ink: #141A33;
  --muted: #5B6385;
  --line: #D9DEEE;
  --accent: #3D5AFE;
  --accent-deep: #2740C9;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E8FF;
  --gold: #F5B700;
  --gold-deep: #C99700;
  --good: #12A150;
  --good-deep: #0B7A3B;
  --good-soft: #DDF5E7;
  --bad: #E5384F;
  --bad-deep: #B8243A;
  --bad-soft: #FDE3E7;
  --lock: #DDE2F2;
  --lock-deep: #C3CAE2;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1226; --surface: #161D3A; --ink: #EDF0FF; --muted: #9AA3CC; --line: #263059;
    --accent: #7C93FF; --accent-deep: #5469D6; --accent-ink: #0D1226; --accent-soft: #1F2A5C;
    --gold: #FFC933; --gold-deep: #A67F00;
    --good: #3DDC84; --good-deep: #1F9F58; --good-soft: #12362A;
    --bad: #FF6B81; --bad-deep: #C4475C; --bad-soft: #3E1B28;
    --lock: #222B52; --lock-deep: #171E3E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1226; --surface: #161D3A; --ink: #EDF0FF; --muted: #9AA3CC; --line: #263059;
  --accent: #7C93FF; --accent-deep: #5469D6; --accent-ink: #0D1226; --accent-soft: #1F2A5C;
  --gold: #FFC933; --gold-deep: #A67F00;
  --good: #3DDC84; --good-deep: #1F9F58; --good-soft: #12362A;
  --bad: #FF6B81; --bad-deep: #C4475C; --bad-soft: #3E1B28;
  --lock: #222B52; --lock-deep: #171E3E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
body.noscroll { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; }
.ico { display: block; flex: none; }
.app { max-width: 560px; margin: 0 auto; min-height: 100vh; }

/* header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 12px; background: var(--bg);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 38px; height: 38px; }
.brand span { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.01em; white-space: nowrap; }
.stats { display: flex; gap: 6px; }
.stat {
  display: flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 999px;
  background: var(--surface); border: 2px solid var(--line);
  font-family: var(--font-mono); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums;
}
.stat.fire { color: #E8590C; }
.stat.bolt { color: var(--gold-deep); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stat.fire { color: #FF9055; } :root:not([data-theme="light"]) .stat.bolt { color: var(--gold); } }
:root[data-theme="dark"] .stat.fire { color: #FF9055; }
:root[data-theme="dark"] .stat.bolt { color: var(--gold); }

main { padding-block: 8px 120px; display: flex; flex-direction: column; gap: 16px; }

/* cards */
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px; }
.goal { display: flex; flex-direction: column; gap: 10px; }
.goal-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.goal-h h2 { font-size: 18px; font-weight: 800; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.goal-h .mono { color: var(--muted); font-size: 13px; }
.bar { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--gold); transition: width .4s ease; }
.goal p { color: var(--muted); font-size: 14px; }
.practice { display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; }
.practice .pi { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.practice b { display: block; font-family: var(--font-display); font-size: 17px; }
.practice span { color: var(--muted); font-size: 14px; }

/* path */
.unit { background: var(--accent-soft); border-radius: 16px; padding: 14px 16px; margin-top: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 8; }
.unit .lab { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.unit h2 { font-size: 20px; font-weight: 800; margin-top: 2px; }
.unit p { color: var(--muted); font-size: 14px; }
.node-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-block: 8px; }
.node {
  width: 78px; height: 78px; border-radius: 50%; border: 0;
  display: grid; place-items: center; position: relative;
  transform: translateX(var(--dx, 0px));
  background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 0 var(--accent-deep);
  transition: translate .1s;
}
.node:active:not(:disabled) { translate: 0 4px; box-shadow: 0 2px 0 var(--accent-deep); }
.node.done { background: var(--gold); color: #141A33; box-shadow: 0 6px 0 var(--gold-deep); }
.node.done:active { box-shadow: 0 2px 0 var(--gold-deep); }
.node.locked { background: var(--lock); color: var(--muted); box-shadow: 0 6px 0 var(--lock-deep); cursor: not-allowed; }
.node.current::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 3px solid var(--accent); opacity: .5; animation: ring 1.8s ease-out infinite; }
@keyframes ring { from { transform: scale(.92); opacity: .7; } to { transform: scale(1.12); opacity: 0; } }
.nlabel { font-weight: 700; font-size: 14px; color: var(--muted); text-align: center; transform: translateX(var(--dx, 0px)); max-width: 200px; }
.nodecard { width: min(100%, 320px); background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.nodecard h3 { font-size: 19px; font-weight: 800; }
.nodecard p { color: var(--muted); font-size: 14px; }

/* buttons */
.btn {
  border: 0; border-radius: 14px; padding: 14px 20px; width: 100%;
  background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-deep);
  font-family: var(--font-display); font-weight: 800; font-size: 16px; letter-spacing: .04em; text-transform: uppercase;
}
.btn:active:not(:disabled) { translate: 0 3px; box-shadow: 0 1px 0 var(--accent-deep); }
.btn:disabled { background: var(--lock); color: var(--muted); box-shadow: 0 4px 0 var(--lock-deep); cursor: not-allowed; }
.btn.bad { background: var(--bad); color: #fff; box-shadow: 0 4px 0 var(--bad-deep); }
.btn.good { background: var(--good); color: #fff; box-shadow: 0 4px 0 var(--good-deep); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.bad, :root:not([data-theme="light"]) .btn.good { color: #0D1226; } }
:root[data-theme="dark"] .btn.bad, :root[data-theme="dark"] .btn.good { color: #0D1226; }
.btn.ghost { background: var(--surface); color: var(--accent); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.btn.small { width: auto; padding: 10px 14px; font-size: 13px; }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 8px 0; text-decoration: underline; text-underline-offset: 3px; }
.iconbtn { background: none; border: 0; color: var(--muted); padding: 6px; border-radius: 10px; display: grid; place-items: center; }

/* tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 12;
  background: var(--surface); border-top: 2px solid var(--line);
  padding-top: 6px; padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; padding-bottom: 6px; }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 12px; color: var(--muted); font-weight: 700; font-size: 11px; }
.tab[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

/* words / profile */
.group h3 { font-size: 17px; font-weight: 800; margin-bottom: 8px; }
.wlist { display: flex; flex-direction: column; }
.wrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.wrow:first-child { border-top: 0; }
.wrow b { font-weight: 700; }
.wrow span { color: var(--muted); font-size: 14px; display: block; }
.empty { text-align: center; padding: 28px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty svg { width: 90px; height: 90px; }
.empty p { color: var(--muted); max-width: 32ch; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; }
.kv:first-child { border-top: 0; }
.kv .mono { font-weight: 700; font-size: 18px; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 14px; font-family: var(--font-mono); font-weight: 700; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.switch { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 700; }
.switch[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.danger { color: var(--bad); }
.note { color: var(--muted); font-size: 13px; }

/* ---- Nekolingo: extras ---- */
.stat.gem { color: var(--accent); }
.ct { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
.card + .card { margin-top: 0; }
.muted { color: var(--muted); }
.grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.brk { overflow-wrap: anywhere; text-align: right; }
.pi, .scard .pi { width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.scard { display: flex; align-items: center; gap: 14px; }
.scard b { font-family: var(--font-display); font-size: 17px; }
.practice:disabled { opacity: .55; cursor: not-allowed; }
.node.chest.current, .node.chest.done { background: var(--gold); color: #141A33; box-shadow: 0 6px 0 var(--gold-deep); }
.node.trophy:not(.locked):not(.done) { background: var(--accent); }
.bar.thin { height: 8px; }
.quest { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.quest .qi { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.quest .qi b { font-weight: 700; font-size: 15px; }
.tag.ok { color: var(--good); }
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.ach { border: 2px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px; opacity: .6; }
.ach.on { opacity: 1; border-color: var(--gold); }
.ach b { font-family: var(--font-display); font-size: 15px; }
.ach .ai, .newach .ai { color: var(--lock-deep); }
.ach.on .ai, .newach .ai { color: var(--gold-deep); }
.newach { display: flex; align-items: center; gap: 10px; border: 2px solid var(--gold); border-radius: 14px; padding: 8px 14px; background: var(--surface); }
.shopgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.item { border: 2px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.item .prev svg { width: 84px; height: 84px; }
.item b { font-family: var(--font-display); font-size: 15px; }
.item .btn { margin-top: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn svg { display: inline-block; vertical-align: middle; }
.hero { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px 16px; border-radius: 18px; background: var(--accent-soft); }
.hero .mascot { width: 132px; height: 132px; }
.nameinp { width: min(100%, 280px); text-align: center; border: 2px solid transparent; border-radius: 12px; background: transparent; color: var(--ink); font: 800 24px var(--font-display); padding: 6px 10px; }
.nameinp:hover, .nameinp:focus { border-color: var(--line); background: var(--surface); outline: none; }
.furs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.fur { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--line); }
.fur[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--bg) inset; }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 130px; }
.bcol { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; }
.bcol i { display: block; width: 100%; max-width: 34px; border-radius: 8px 8px 4px 4px; background: var(--accent); }
.bcol.today i { background: var(--gold); }
.bcol span { font-size: 12px; font-weight: 700; color: var(--muted); }
.bcol small { font-family: var(--font-mono); font-size: 11px; color: var(--muted); min-height: 14px; }
.acct { display: flex; flex-direction: column; gap: 10px; }
details.card summary { font-family: var(--font-display); font-weight: 800; font-size: 17px; cursor: pointer; }
details.card[open] summary { margin-bottom: 10px; }
.msgbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; max-width: calc(100% - 32px); text-align: center; }
.modal.fx { position: fixed; z-index: 40; }
.chestcard { align-items: center; text-align: center; }
.bigico { color: var(--gold-deep); display: grid; place-items: center; }
.micwrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 0; }
.bigspk.mic.on { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 12px var(--accent-soft); } }
.sentence { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.25; }
.word2 { font-size: 20px; font-weight: 700; }
.who { display: block; font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
@media (max-width: 400px) { .brand span { display: none; } }

/* conversa */
.chat { display: flex; flex-direction: column; gap: 10px; }
.bub { display: flex; align-items: flex-start; gap: 10px; max-width: 90%; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 2px solid var(--line); }
.bub > div { min-width: 0; overflow-wrap: anywhere; }
.bub.l { align-self: flex-start; border-bottom-left-radius: 4px; }
.bub.r { align-self: flex-end; border-bottom-right-radius: 4px; background: var(--accent-soft); border-color: var(--accent-soft); }
.bub b { display: block; font-size: 18px; font-weight: 700; }
.bub .pt { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.spk.sm { width: 36px; height: 36px; border-radius: 10px; }
.row2 { display: flex; gap: 10px; flex-wrap: wrap; }
.bub .spk { background: var(--bg); }

/* play overlay */
.play { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.play[hidden] { display: none; }
.pin { flex: 1; min-height: 0; overflow-y: auto; width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.ptop { display: flex; align-items: center; gap: 12px; }
.track { flex: 1; height: 14px; border-radius: 999px; background: var(--line); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .35s ease; }
.hp { display: flex; align-items: center; gap: 5px; color: var(--bad); font-family: var(--font-mono); font-weight: 700; }
.pmain { display: flex; flex-direction: column; gap: 20px; flex: 1; }
.pmain.locked { pointer-events: none; }
.q { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; }
.word { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 800; font-size: 30px; }
.spk, .bigspk { border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 14px; width: 48px; height: 48px; display: grid; place-items: center; flex: none; }
.bigspk { width: 92px; height: 92px; border-radius: 22px; background: var(--accent); color: var(--accent-ink); box-shadow: 0 5px 0 var(--accent-deep); }
.listen { display: flex; align-items: center; gap: 14px; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 12px; text-align: left;
  padding: 14px 16px; border-radius: 14px; background: var(--surface);
  border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); font-weight: 600; font-size: 17px;
}
.opt kbd { font-family: var(--font-mono); font-size: 12px; border: 2px solid var(--line); border-radius: 8px; padding: 1px 7px; color: var(--muted); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 3px 0 var(--accent); }
.opt.good { border-color: var(--good); background: var(--good-soft); box-shadow: 0 3px 0 var(--good); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 3px 0 var(--bad); }
.ti { width: 100%; border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; background: var(--surface); color: var(--ink); font: 600 20px var(--font-body); }
.ti:focus { border-color: var(--accent); outline: none; }
.ti.good { border-color: var(--good); background: var(--good-soft); }
.ti.bad { border-color: var(--bad); background: var(--bad-soft); }
.hint { color: var(--muted); font-size: 14px; }
.src { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; }
.ans { min-height: 72px; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); align-content: flex-start; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 17px; box-shadow: 0 3px 0 var(--line); }
.chip.ghost { background: var(--line); border-color: var(--line); color: transparent; box-shadow: none; pointer-events: none; }
.ans.good .chip { border-color: var(--good); background: var(--good-soft); box-shadow: 0 3px 0 var(--good); }
.ans.bad .chip { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 3px 0 var(--bad); }
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.mbtn { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 10px; font-weight: 700; font-size: 16px; box-shadow: 0 3px 0 var(--line); min-height: 56px; overflow-wrap: anywhere; }
.mbtn.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 3px 0 var(--accent); }
.mbtn.ok { border-color: var(--good); background: var(--good-soft); color: var(--good); box-shadow: none; opacity: .75; pointer-events: none; }
.mbtn.no { border-color: var(--bad); background: var(--bad-soft); animation: shake .3s; }
@keyframes shake { 25% { translate: -5px 0; } 75% { translate: 5px 0; } }

.pfoot { padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 2px solid var(--line); background: var(--bg); }
.pfoot.ok { background: var(--good-soft); border-color: var(--good-soft); }
.pfoot.bad { background: var(--bad-soft); border-color: var(--bad-soft); }
.pfoot-in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.fb { display: flex; flex-direction: column; gap: 4px; }
.fbh { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.pfoot.ok .fbh { color: var(--good); }
.pfoot.bad .fbh { color: var(--bad); }
.fbc { font-weight: 600; }

.end { align-items: center; text-align: center; justify-content: center; }
.end svg.mascot { width: 140px; height: 140px; }
.end h2 { font-size: 30px; font-weight: 800; }
.end p { color: var(--muted); max-width: 34ch; }
.endstats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.es { border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 16px; min-width: 96px; }
.es b { display: block; font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.es span { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.endrow { display: flex; flex-direction: column; gap: 10px; width: 100%; }

.modal { position: absolute; inset: 0; background: rgba(8, 12, 30, .55); display: grid; place-items: center; padding: 16px; z-index: 5; }
.modal .card { width: min(100%, 360px); display: flex; flex-direction: column; gap: 14px; }
.modal h3 { font-size: 20px; font-weight: 800; }
.modal p { color: var(--muted); }

  function render() {

  }

/* ---------- modo exercício ---------- */
  var run = null, cur = null, curRec = null;
  var PRAISE = ['Muito bem!', 'Isso aí!', 'Perfeito!', 'Mandou bem!', 'Boa!'];
  var isGraded = function (x) { return x.t !== 'intro' && x.t !== 'dialog'; };
  function stopRec() { if (curRec) { try { curRec.abort(); } catch (e) {} curRec = null; } }

  function start(kind, arg) {
    var q = [], L = null, story = null, unit = null;
    if (kind === 'lesson') { L = arg; q = lessonEx(L, LESSONS.indexOf(L)); }
    else if (kind === 'review') { unit = arg; q = reviewEx(unit); }
    else if (kind === 'practice') q = practiceEx();
    else if (kind === 'story') { story = arg; q = storyEx(story); }
    else if (kind === 'drill') q = drillEx(arg);
    if (!q.length) { toast('Termine uma lição primeiro.'); return; }
    run = { kind: kind, L: L, story: story, unit: unit, queue: q, i: 0, done: 0, total: q.filter(isGraded).length, mistakes: 0, correct: 0, spoke: 0 };
    $('#play').hidden = false; document.body.classList.add('noscroll');
    renderPlay();
  }
  function closePlay() {
    speechCancel(); stopRec(); run = null; cur = null;
    $('#play').hidden = true; document.body.classList.remove('noscroll');
    render();
  }
  function setProgress() { var t = $('.track i'); if (t) t.style.width = Math.round(run.done / run.total * 100) + '%'; }

  function renderPlay() {
    var ex = run.queue[run.i];
    var pct = Math.round(run.done / run.total * 100);
    $('#play').innerHTML =
      '<div class="pin"><div class="ptop"><button class="iconbtn" id="pquit" aria-label="Sair">' + ico('x', 24) + '</button>' +
      '<div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div></div>' +
      '<div class="pmain" id="pmain"></div></div><div class="pfoot" id="pfoot"></div>';
    $('#pquit').onclick = askQuit;
    cur = { ex: ex, locked: false, sel: null, check: null };
    footCheck(false);
    var fn = { intro: rIntro, dialog: rDialog, reply: rReply, fill: rFill, sq: rSq, speak: rSpeak, choose: rChoose, chooseEn: rChoose, listen: rListen, type: rType, typePhrase: rType, listenType: rType, build: rBuild, match: rMatch }[ex.t];
    fn(ex);
  }
  function footCheck(enabled) {
    var f = $('#pfoot'); f.className = 'pfoot';
    f.innerHTML = '<div class="pfoot-in"><button class="btn" id="pcheck"' + (enabled ? '' : ' disabled') + '>Verificar</button></div>';
    $('#pcheck').onclick = function () { if (cur && cur.check && !cur.locked) cur.check(); };
  }
  function enableCheck(on) { var b = $('#pcheck'); if (b) b.disabled = !on; }
  function feedback(ok, correct) {
    var f = $('#pfoot'); f.className = 'pfoot ' + (ok ? 'ok' : 'bad');
    f.innerHTML = '<div class="pfoot-in"><div class="fb"><div class="fbh">' + ico(ok ? 'check' : 'x', 24) + '<span>' + (ok ? pickOne(PRAISE) : 'Resposta correta') + '</span></div>' +
      (ok ? '' : '<p class="fbc">' + correct + '</p>') + '</div><button class="btn ' + (ok ? 'good' : 'bad') + '" id="pnext">Continuar</button></div>';
    $('#pnext').onclick = next; $('#pnext').focus();
  }
  function lockMain() { cur.locked = true; $('#pmain').classList.add('locked'); }
  function grade(ok, correct) {
    lockMain();
    var ex = cur.ex;
    if (ex.k) {
      if (ok) { if (S.weak[ex.k]) { S.weak[ex.k]--; if (S.weak[ex.k] <= 0) delete S.weak[ex.k]; } }
      else S.weak[ex.k] = (S.weak[ex.k] || 0) + 1;
    }
    if (ok) { run.done++; run.correct++; setProgress(); sfx.ok(); }
    else {
      run.mistakes++; sfx.bad();
      var again = {}; for (var k in ex) again[k] = ex[k];
      if (again.options) again.options = shuffle(again.options);
      if (again.bank) again.bank = shuffle(again.bank);
      run.queue.push(again);
    }
    feedback(ok, correct);
  }
  function next() {
    if (!run) return;
    stopRec();
    run.i++;
    if (run.i >= run.queue.length) return showDone();
    renderPlay();
  }
  function askQuit() {
    var m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = '<div class="card" role="dialog" aria-label="Sair"><h3>Quer sair agora?</h3><p>Você perde o que já fez nesta sessão.</p>' +
      '<button class="btn" id="mstay">Continuar aqui</button><button class="btn ghost" id="mleave">Sair</button></div>';
    $('#play').appendChild(m);
    $('#mstay').onclick = function () { m.remove(); };
    $('#mleave').onclick = closePlay;
    $('#mstay').focus();
  }

  /* múltipla escolha (choose, chooseEn) */
  function rChoose(ex) {
    var isEn = ex.t === 'choose';
    $('#pmain').innerHTML = '<h2 class="q">' + (isEn ? 'O que significa?' : 'Como se diz em inglês?') + '</h2>' +
      '<div class="word">' + (isEn && CAN_SPEAK ? '<button class="spk" id="spk" aria-label="Ouvir">' + ico('speaker', 24) + '</button>' : '') + '<span>' + ex.word + '</span></div>' +
      '<div class="opts">' + ex.options.map(function (o, k) { return '<button class="opt" data-k="' + k + '"><kbd>' + (k + 1) + '</kbd><span>' + o + '</span></button>'; }).join('') + '</div>';
    var sp = $('#spk'); if (sp) sp.onclick = function () { speak(ex.word); };

  }
  function wireOptions(ex, speakOnPick) {
    var btns = $$('.opt');
    btns.forEach(function (b) {
      b.onclick = function () {
        if (cur.locked) return;
        cur.sel = +b.dataset.k;
        btns.forEach(function (x) { x.classList.toggle('sel', x === b); });
        if (speakOnPick) speak(ex.options[cur.sel]);
        enableCheck(true);
      };
    });
    cur.check = function () {
      var pick = ex.options[cur.sel], ok = pick === ex.answer;
      btns.forEach(function (b, k) {
        b.classList.remove('sel');
        if (ex.options[k] === ex.answer) b.classList.add('good');
        else if (k === cur.sel) b.classList.add('bad');
      });
      grade(ok, ex.answer);
    };
  }

  /* ouvir */
  function rListen(ex) {
    $('#pmain').innerHTML = '<h2 class="q">Toque no que você ouvir</h2>' +
      '<div class="listen"><button class="bigspk" id="spk" aria-label="Ouvir de novo">' + ico('speaker', 44) + '</button><button class="btn ghost small" id="slow">Mais devagar</button></div>' +
      '<div><button class="linkbtn" id="show">Não consigo ouvir</button><p class="hint" id="txt" hidden>Está escrito: <b>' + ex.word + '</b></p></div>' +
      '<div class="opts">' + ex.options.map(function (o, k) { return '<button class="opt" data-k="' + k + '"><kbd>' + (k + 1) + '</kbd><span>' + o + '</span></button>'; }).join('') + '</div>';
    $('#spk').onclick = function () { speak(ex.word, 0.9); };
    $('#slow').onclick = function () { speak(ex.word, 0.5); };
    $('#show').onclick = function () { $('#txt').hidden = false; };
    wireOptions(ex, false);
    setTimeout(function () { if (cur && cur.ex === ex && !cur.locked) speak(ex.word, 0.9); }, 250);
  }

  

  /* digitar, escrever o que ouviu */
  function rType(ex) {
    var t = ex.t, answer = ex.answer;
    var words = answer.split(' ').length, letters = answer.replace(/ /g, '').length, head;
    if (t === 'listenType') head = '<h2 class="q">Escreva o que você ouviu</h2><div class="listen"><button class="bigspk" id="spk" aria-label="Ouvir de novo">' + ico('speaker', 44) + '</button><button class="btn ghost small" id="slow">Mais devagar</button></div>';
    else if (t === 'typePhrase') head = '<h2 class="q">Escreva a frase em inglês</h2><div class="src"><span>' + ex.prompt + '</span></div>';
    else head = '<h2 class="q">Escreva em inglês</h2><div class="word"><span>' + ex.word + '</span></div>';
    $('#pmain').innerHTML = head +
      '<input class="ti" id="ti" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Digite aqui" aria-label="Resposta em inglês">' +
      '<p class="hint">' + (words > 1 ? words + ' palavras, ' : '') + letters + ' letras</p>';
    var ti = $('#ti');
    if (t === 'listenType') {
      $('#spk').onclick = function () { speak(answer, 0.9); };
      $('#slow').onclick = function () { speak(answer, 0.5); };
      setTimeout(function () { if (cur && cur.ex === ex && !cur.locked) speak(answer, 0.9); }, 250);
    }
    ti.oninput = function () { enableCheck(ti.value.trim().length > 0); };
    cur.check = function () {
      var ok = norm(ti.value) === norm(answer);
      ti.classList.add(ok ? 'good' : 'bad'); ti.readOnly = true;
      grade(ok, answer);
      if (ok && t !== 'listenType') speak(answer);
    };
    if (t !== 'listenType') setTimeout(function () { ti.focus(); }, 50);
  }

  /* completar a frase */
  function rFill(ex) {
    $('#pmain').innerHTML = '<h2 class="q">Complete a frase</h2><p class="hint">' + ex.pt + '</p><p class="sentence">' + ex.sentence + '</p>' +
      '<div class="opts">' + ex.options.map(function (o, k) { return '<button class="opt" data-k="' + k + '"><kbd>' + (k + 1) + '</kbd><span>' + o + '</span></button>'; }).join('') + '</div>';

  /* pergunta de história */
  function rSq(ex) {

      '<div class="opts">' + ex.options.map(function (o, k) { return '<button class="opt" data-k="' + k + '"><kbd>' + (k + 1) + '</kbd><span>' + o + '</span></button>'; }).join('') + '</div>';
    wireOptions(ex, false);
  }

  /* falar no microfone */
  function speakScore(heard, target) {
    var a = norm(heard).split(' '), b = norm(target).split(' '), hit = 0;
    b.forEach(function (w) { var k = a.indexOf(w); if (k > -1) { hit++; a.splice(k, 1); } });
    return hit / b.length;
  }
  function rSpeak(ex) {
    $('#pmain').innerHTML = '<h2 class="q">Fale esta frase</h2><div class="src">' + (CAN_SPEAK ? '<button class="spk" id="spk" aria-label="Ouvir">' + ico('speaker', 24) + '</button>' : '') + '<span>' + ex.answer + '</span></div><p class="hint">' + ex.pt + '</p>' +
      '<div class="micwrap"><button class="bigspk mic" id="mic" aria-label="Falar">' + ico('mic', 44) + '</button><p class="hint" id="mstat">Toque no microfone e fale a frase.</p></div>' +
      '<div><button class="linkbtn" id="skip">Não posso falar agora</button></div>';
    var sp = $('#spk'); if (sp) sp.onclick = function () { speak(ex.answer); };
    var mic = $('#mic'), stat = $('#mstat'), listening = false;
    var noMic = function () { stat.textContent = 'Não consegui usar o microfone aqui. Toque em "Não posso falar agora".'; };
    $('#skip').onclick = function () { if (cur.locked) return; stopRec(); lockMain(); run.done++; setProgress(); next(); };
    mic.onclick = function () {
      if (cur.locked || listening) return;
      var rec;
      try { rec = new SRC(); rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 3; } catch (e) { return noMic(); }
      curRec = rec; listening = true; mic.classList.add('on'); stat.textContent = 'Ouvindo...';
      var got = false;
      rec.onresult = function (e) {
        got = true;
        var best = 0, heard = '';
        for (var i = 0; i < e.results[0].length; i++) {
          var tr = e.results[0][i].transcript, s = speakScore(tr, ex.answer);
          if (s >= best) { best = s; heard = tr; }
        }
        var ok = best >= 0.75;
        stat.textContent = 'Você disse: ' + heard;
        if (ok) run.spoke++;
        grade(ok, ex.answer);
      };
      rec.onerror = function (e) {
        listening = false; mic.classList.remove('on');
        if (e.error === 'no-speech') stat.textContent = 'Não ouvi nada. Tente de novo.';
        else if (e.error !== 'aborted') noMic();
      };
      rec.onend = function () {
        listening = false; mic.classList.remove('on');
        if (!got && !cur.locked && stat.textContent === 'Ouvindo...') stat.textContent = 'Não ouvi nada. Tente de novo.';
      };
      try { rec.start(); } catch (e) { listening = false; mic.classList.remove('on'); noMic(); }
    };
  }

  /* montar frase */
  function rBuild(ex) {
    var toEn = ex.dir === 'pt2en';
    $('#pmain').innerHTML = '<h2 class="q">' + (toEn ? 'Traduza para o inglês' : 'Traduza para o português') + '</h2>' +
      '<div class="src">' + (!toEn && CAN_SPEAK ? '<button class="spk" id="spk" aria-label="Ouvir">' + ico('speaker', 24) + '</button>' : '') + '<span>' + ex.source + '</span></div>' +
      '<div class="ans" id="ans" aria-label="Sua resposta"></div><div class="bank" id="bank"></div>';
    var sp = $('#spk'); if (sp) sp.onclick = function () { speak(ex.source); };
    var chosen = [];
    function draw() {
      $('#ans').innerHTML = chosen.map(function (bi, k) { return '<button class="chip" data-a="' + k + '">' + ex.bank[bi] + '</button>'; }).join('');
      $('#bank').innerHTML = ex.bank.map(function (w, bi) { return '<button class="chip' + (chosen.indexOf(bi) > -1 ? ' ghost' : '') + '" data-b="' + bi + '">' + w + '</button>'; }).join('');
      $$('[data-a]').forEach(function (b) { b.onclick = function () { if (cur.locked) return; chosen.splice(+b.dataset.a, 1); draw(); }; });
      $$('[data-b]').forEach(function (b) { b.onclick = function () {

    cur.check = function () {

      var ok = got === ex.target.map(function (t) { return t.toLowerCase(); }).join(' ');

      grade(ok, ex.targetText);
      if (ok && toEn) speak(ex.targetText);
    };
  }

  /* ligar pares */
  function rMatch(ex) {
    var left = shuffle(ex.pairs.map(function (p) { return p[0]; })), right = shuffle(ex.pairs.map(function (p) { return p[1]; }));
    $('#pmain').innerHTML = '<h2 class="q">Ligue os pares</h2><p class="hint">Toque numa palavra em inglês e depois no significado.</p>' +
      '<div class="mgrid"><div class="mcol">' + left.map(function (w, i) { return '<button class="mbtn" data-l="' + i + '">' + w + '</button>'; }).join('') + '</div>' +
      '<div class="mcol">' + right.map(function (w, i) { return '<button class="mbtn" data-r="' + i + '">' + w + '</button>'; }).join('') + '</div></div>';
    var selL = null, selR = null, matched = 0, penalized = false;
    var lb = $$('[data-l]'), rb = $$('[data-r]');
    function clearSel() { lb.concat(rb).forEach(function (b) { b.classList.remove('sel'); }); selL = selR = null; }
    function tryPair() {
      if (selL === null || selR === null) return;
      var en = left[selL], pt = right[selR];
      var good = ex.pairs.some(function (p) { return p[0] === en && p[1] === pt; });
      var a = lb[selL], b = rb[selR];
      if (good) {
        a.classList.remove('sel'); b.classList.remove('sel'); a.classList.add('ok'); b.classList.add('ok'); matched++; selL = selR = null;
        if (matched === ex.pairs.length) { lockMain(); run.done++; run.correct++; setProgress(); sfx.ok(); feedback(true); }
      } else {
        a.classList.add('no'); b.classList.add('no');
        if (!penalized) { penalized = true; run.mistakes++; sfx.bad(); } else sfx.bad();
        setTimeout(function () { a.classList.remove('no'); b.classList.remove('no'); clearSel(); }, 350);
      }
    }
    lb.forEach(function (b, i) { b.onclick = function () { lb.forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); selL = i; speak(left[i]); tryPair(); }; });
    rb.forEach(function (b, i) { b.onclick = function () { rb.forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel'); selR = i; tryPair(); }; });

  }

  /* fim da sessão */
  function showDone() {
    var kind = run.kind, perfect = run.mistakes === 0, bonus = perfect ? 5 : 0, gain, gems;
    if (kind === 'lesson') { gain = 15 + bonus; gems = 5 + (perfect ? 3 : 0); }
    else if (kind === 'review') { gain = 15 + bonus; gems = S.units[run.unit.n] ? 5 : 20; }
    else if (kind === 'story') { gain = 10 + bonus; gems = 3; }
    else { gain = 8 + bonus; gems = 2; }
    addXp(gain); addGems(gems); touchStreak();
    var q = dq(), nextTitle = null;
    q.correct += run.correct; S.stats.correct += run.correct; S.stats.spoke += run.spoke;
    if (kind === 'lesson' || kind === 'review') { q.lessons++; if (perfect) { q.perfect++; S.stats.perfect++; } }
    if (kind === 'lesson') {
      S.stats.lessons++;
      var first = !S.done[run.L.id]; S.done[run.L.id] = (S.done[run.L.id] || 0) + 1;
      var idx = LESSONS.indexOf(run.L);
      if (first && LESSONS[idx + 1]) nextTitle = LESSONS[idx + 1].title;
    }
    if (kind === 'review') S.units[run.unit.n] = (S.units[run.unit.n] || 0) + 1;
    if (kind === 'story') S.stories[run.story.id] = (S.stories[run.story.id] || 0) + 1;
    var newly = checkAch(); save(); sfx.win();
    var title = { lesson: 'Lição concluída!', review: 'Unidade revisada!', story: 'História concluída!', practice: 'Revisão feita!', drill: 'Treino feito!' }[kind];
    var acc = Math.round(run.total / (run.total + run.mistakes) * 100), tc = shownStreak();
    $('#play').innerHTML = '<div class="pin end">' + mascot('happy') + '<h2>' + title + '</h2>' +
      '<div class="endstats"><div class="es"><b>+' + gain + '</b><span>XP</span></div><div class="es"><b>+' + gems + '</b><span>Gemas</span></div><div class="es"><b>' + acc + '%</b><span>Precisão</span></div><div class="es"><b>' + tc + '</b><span>' + (tc === 1 ? 'Dia' : 'Dias') + ' seguidos</span></div></div>' +
      (nextTitle ? '<p>Nova lição liberada: <b>' + nextTitle + '</b></p>' : (perfect ? '<p>Sem nenhum erro. Bônus de 5 XP.</p>' : '<p>Os erros voltaram no fim pra você fixar.</p>')) +
      newly.map(function (a) { return '<div class="newach"><span class="ai">' + ico(a.ic, 24) + '</span><span>Conquista: <b>' + a.t + '</b></span></div>'; }).join('') +
      '</div><div class="pfoot"><div class="pfoot-in"><button class="btn" id="pend">Continuar</button></div></div>';
    $('#pend').onclick = closePlay; $('#pend').focus();
  }

  document.addEventListener('keydown', function (e) {
    if ($('#play').hidden) return;
    if (e.key === 'Enter') {
      var b = $('#pnext') || $('#pend') || $('#pcheck');
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    } else if (/^[1-4]$/.test(e.key) && cur && !cur.locked && document.activeElement && document.activeElement.tagName !== 'INPUT') {
      var o = $$('.opt')[+e.key - 1]; if (o) o.click();
    }
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && syncOn() && S.sync && Date.now() - syncState.t > 60000) syncNow();
  });

  render();
  if (syncOn() && S.sync) syncNow();

})();
</script>
<style>.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:700;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}.toast[hidden]{display:none}.toast button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:6px 12px;font:inherit;font-weight:800;cursor:pointer}</style>
<div class="toast" id="upd" hidden role="status"><span>Tem versão nova do app.</span><button id="updbtn">Atualizar</button></div>
<script>
(function(){
  if(!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  var had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(had){ var u=document.getElementById('upd'); if(u) u.hidden=false; }
    had = true;
  });
  var b=document.getElementById('updbtn'); if(b) b.onclick=function(){ location.reload(); };
})();
</script>
